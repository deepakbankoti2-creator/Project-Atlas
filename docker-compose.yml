version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. MySQL 8.0 Enterprise Relational Store
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: atlas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_2025
      MYSQL_DATABASE: project_atlas
      MYSQL_USER: atlas_user
      MYSQL_PASSWORD: atlas_secure_password_2025
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - atlas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password_2025"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - atlas_network

  # -------------------------------------------------------------------
  # 2. Project Atlas FastAPI Agent Copilot Backend
  # -------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: atlas_fastapi
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: project_atlas
      DB_USER: atlas_user
      DB_PASSWORD: atlas_secure_password_2025
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: llama3.2:3b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      CHROMA_COLLECTION_NAME: atlas_reports
      REPORTS_DIR: /app/data/reports
      ATLAS_API_KEY: atlas_secret_token_2025
      ADMIN_API_KEY: atlas_admin_secret_key_2025
      OLLAMA_TIMEOUT_SECONDS: 10.0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - atlas_network

  # -------------------------------------------------------------------
  # 3. CodeIgniter 3 PHP Web Portal
  # -------------------------------------------------------------------
  portal_ci3:
    build:
      context: .
      dockerfile: portal_ci3/Dockerfile
    container_name: atlas_portal_ci3
    restart: unless-stopped
    depends_on:
      - fastapi
      - mysql
    environment:
      ATLAS_API_URL: http://fastapi:8000
      ATLAS_API_TIMEOUT: 30
      ATLAS_API_KEY: atlas_secret_token_2025
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: project_atlas
      DB_USER: atlas_user
      DB_PASSWORD: atlas_secure_password_2025
      CI_BASE_URL: http://localhost:8080/
      CI_ENV: development
    ports:
      - "8080:80"
    networks:
      - atlas_network

volumes:
  atlas_mysql_data:
    driver: local

networks:
  atlas_network:
    driver: bridge
